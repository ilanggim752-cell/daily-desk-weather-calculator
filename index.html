<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>오늘의 작업실 · 계산기와 날씨</title>
  <style>
    :root { font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif; color: #1b2a42; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 90% 0, #deefff 0, transparent 34%), radial-gradient(circle at 0 70%, #e8efff 0, transparent 34%), #f4f7fb; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1110px; margin: auto; padding: 48px 24px 80px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 32px; }
    .eyebrow { display: inline-flex; gap: 7px; align-items: center; margin-bottom: 13px; color: #3474b6; font-size: 12px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #61a7e2; box-shadow: 0 0 0 4px #dceeff; }
    h1 { font-size: clamp(28px, 4.5vw, 42px); line-height: 1.2; letter-spacing: -.055em; margin: 0 0 10px; }
    .subtitle { margin: 0; color: #77869b; font-size: 14px; }
    .clock { color: #58708e; text-align: right; white-space: nowrap; padding-top: 25px; }
    .clock strong { display: block; font-size: 23px; color: #193858; letter-spacing: -.04em; }
    .clock span { font-size: 12px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 420px); gap: 22px; align-items: stretch; }
    .card { min-width: 0; padding: 27px; border: 1px solid #e9eff7; border-radius: 25px; background: #fff; box-shadow: 0 14px 42px #2451740b; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 25px; }
    .card-head h2 { margin: 0; font-size: 18px; letter-spacing: -.035em; }
    .tag { padding: 6px 10px; border-radius: 99px; color: #4178b0; background: #ebf5fe; font-size: 11px; font-weight: 700; }
    .search { display: flex; gap: 8px; margin-bottom: 24px; }
    .search input { min-width: 0; flex: 1; height: 43px; padding: 0 14px; border: 1px solid #dce7f1; border-radius: 12px; outline: none; color: #213a57; background: #f8fbff; }
    .search input:focus { border-color: #7caee1; box-shadow: 0 0 0 3px #e8f3ff; }
    .search button, .locate { border: 0; border-radius: 12px; background: #eaf3fc; color: #2d6eab; font-size: 13px; font-weight: 750; padding: 0 13px; }
    .search button:hover, .locate:hover { background: #dbeeff; }
    .weather-hero { min-height: 215px; padding: 24px; border-radius: 19px; background: linear-gradient(125deg, #3789d2, #235dba 75%, #264fa9); color: white; position: relative; overflow: hidden; }
    .weather-hero::after { content: ""; position: absolute; right: -28px; bottom: -75px; width: 230px; height: 230px; border: 1px solid #ffffff35; border-radius: 50%; box-shadow: 0 0 0 34px #ffffff0b, 0 0 0 70px #ffffff0b; pointer-events: none; }
    .location { font-size: 14px; font-weight: 700; opacity: .95; }
    .weather-main { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 19px; position: relative; z-index: 1; }
    .temp { font-size: clamp(60px, 7vw, 84px); line-height: 1; font-weight: 650; letter-spacing: -.075em; }
    .temp small { font-size: 27px; vertical-align: top; letter-spacing: 0; }
    .weather-icon { font-size: 80px; line-height: 1; filter: drop-shadow(0 10px 10px #123e8a33); }
    .condition { margin-top: 12px; font-size: 14px; opacity: .92; }
    .weather-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 18px; }
    .info { padding: 14px 10px; text-align: center; background: #f4f8fd; border-radius: 13px; }
    .info span { display: block; margin-bottom: 4px; color: #8391a4; font-size: 11px; }
    .info strong { color: #2b4a6c; font-size: 14px; }
    .forecast-title { margin: 25px 0 13px; font-size: 13px; font-weight: 800; color: #45607e; }
    .forecast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .day { padding: 12px 5px; border: 1px solid #edf2f8; border-radius: 14px; text-align: center; }
    .day b, .day span, .day small { display: block; }
    .day b { font-size: 12px; color: #596e87; } .day span { font-size: 26px; margin: 6px 0; } .day small { font-size: 12px; color: #7990a5; } .day small strong { color: #274764; }
    .weather-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 20px; }
    .locate { min-height: 35px; } .updated { color: #91a0b2; font-size: 11px; text-align: right; }
    .message { min-height: 19px; margin: 12px 0 0; color: #b04c4c; font-size: 12px; }
    .calc-card { display: flex; flex-direction: column; }
    .display { min-height: 142px; margin-bottom: 18px; padding: 22px 20px; border: 1px solid #e8f0f7; border-radius: 18px; background: #f6f9fd; text-align: right; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
    .expression { min-height: 23px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8292a5; font-size: 14px; }
    .result { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(35px, 5vw, 47px); letter-spacing: -.055em; font-weight: 700; font-variant-numeric: tabular-nums; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .key { height: 66px; border: 0; border-radius: 15px; background: #f2f6fa; color: #28425f; font-size: 20px; font-weight: 600; transition: transform .12s, background .12s; }
    .key:hover { background: #e5eef8; transform: translateY(-2px); } .key:active { transform: translateY(0); }
    .key.action { color: #3576b7; background: #eaf4fd; } .key.operator { color: #236db5; background: #eaf3fd; }
    .key.equal { color: white; background: #347eca; } .key.equal:hover { background: #226db9; }
    .key:focus-visible, button:focus-visible { outline: 3px solid #87b8ea; outline-offset: 2px; }
    .hint { margin: auto 0 0; padding-top: 23px; text-align: center; color: #9aa9b8; font-size: 11px; }
    footer { margin-top: 24px; text-align: center; color: #9baabc; font-size: 11px; }
    @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } .clock { padding-top: 0; } }
    @media (max-width: 480px) { .shell { padding: 28px 14px 48px; } .top { margin-bottom: 23px; } .clock strong { font-size: 17px; } .clock span { font-size: 10px; } .card { padding: 19px; border-radius: 20px; } .weather-hero { min-height: 195px; } .key { height: 58px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div><div class="eyebrow">MY DAILY DESK</div><h1>오늘의 작업실</h1><p class="subtitle">필요한 정보는 간결하게, 하루는 더 가볍게.</p></div>
      <div class="clock"><strong id="clock">--:--</strong><span id="today">날짜 불러오는 중</span></div>
    </div>
    <div class="layout">
      <section class="card" aria-labelledby="weather-heading">
        <div class="card-head"><h2 id="weather-heading">☁️ 날씨</h2><span class="tag">LIVE WEATHER</span></div>
        <form class="search" id="city-form"><input id="city-input" type="search" placeholder="도시 검색 · 예: 서울, 부산, Tokyo" aria-label="도시 이름" autocomplete="off"><button type="submit">검색</button></form>
        <div class="weather-hero"><div class="location" id="location">서울 날씨를 불러오는 중...</div><div class="weather-main"><div class="temp" id="temperature">--<small>°</small></div><div class="weather-icon" id="weather-icon" aria-hidden="true">☀️</div></div><div class="condition" id="condition">잠시만 기다려 주세요</div></div>
        <div class="weather-info"><div class="info"><span>체감 온도</span><strong id="feels">--°</strong></div><div class="info"><span>습도</span><strong id="humidity">--%</strong></div><div class="info"><span>풍속</span><strong id="wind">-- km/h</strong></div></div>
        <div class="forecast-title">앞으로의 날씨</div><div class="forecast" id="forecast" aria-label="4일간 날씨 예보"></div>
        <div class="weather-actions"><button class="locate" id="my-location" type="button">◎ 현재 위치</button><span class="updated" id="updated">날씨 데이터: Open-Meteo</span></div>
        <p class="message" id="weather-message" role="status" aria-live="polite"></p>
      </section>
      <section class="card calc-card" aria-labelledby="calc-heading">
        <div class="card-head"><h2 id="calc-heading">▦ 계산기</h2><span class="tag">QUICK CALC</span></div>
        <div class="display" aria-live="polite"><div class="expression" id="expression">&nbsp;</div><div class="result" id="result">0</div></div>
        <div class="keys" id="keys">
          <button class="key action" data-key="clear" aria-label="모두 지우기">AC</button><button class="key action" data-key="sign" aria-label="부호 바꾸기">+/−</button><button class="key action" data-key="percent" aria-label="백분율">%</button><button class="key operator" data-key="/" aria-label="나누기">÷</button>
          <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key operator" data-key="*" aria-label="곱하기">×</button>
          <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key operator" data-key="-" aria-label="빼기">−</button>
          <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key operator" data-key="+" aria-label="더하기">+</button>
          <button class="key action" data-key="back" aria-label="마지막 숫자 지우기">⌫</button><button class="key" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key equal" data-key="=" aria-label="결과 계산">=</button>
        </div>
        <p class="hint">키보드 숫자 · 사칙연산 · Enter · Backspace · Esc 지원</p>
      </section>
    </div>
    <footer>날씨 제공: Open-Meteo · 날씨 조회에 인터넷 연결이 필요합니다.</footer>
  </main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const updateClock = () => {
      const now = new Date();
      $('clock').textContent = new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
      $('today').textContent = new Intl.DateTimeFormat('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }).format(now);
    };
    updateClock(); setInterval(updateClock, 10000);

    // Open-Meteo의 WMO 날씨 코드: 외부 라이브러리·API 키 불필요.
    function weatherInfo(code, night = false) {
      if (code === 0) return [night ? '🌙' : '☀️', '맑음'];
      if ([1, 2].includes(code)) return [night ? '☁️' : '🌤️', '대체로 맑음'];
      if (code === 3) return ['☁️', '흐림'];
      if ([45, 48].includes(code)) return ['🌫️', '안개'];
      if ([51, 53, 55, 56, 57].includes(code)) return ['🌦️', '이슬비'];
      if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ['🌧️', '비'];
      if ([71, 73, 75, 77, 85, 86].includes(code)) return ['🌨️', '눈'];
      if ([95, 96, 99].includes(code)) return ['⛈️', '뇌우'];
      return ['🌤️', '날씨 정보'];
    }
    let weatherRequest;
    async function loadWeather(latitude, longitude, name) {
      weatherRequest?.abort();
      const controller = new AbortController(); weatherRequest = controller;
      $('weather-message').textContent = '';
      $('location').textContent = `${name} 날씨를 불러오는 중...`;
      try {
        const url = new URL('https://api.open-meteo.com/v1/forecast');
        url.search = new URLSearchParams({ latitude, longitude, current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day', daily: 'weather_code,temperature_2m_max,temperature_2m_min', forecast_days: '4', timezone: 'auto' });
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error('날씨 서버에 연결할 수 없습니다.');
        const data = await response.json();
        if (!data.current || !data.daily) throw new Error('날씨 데이터 형식이 예상과 다릅니다.');
        if (controller.signal.aborted) return;
        const current = data.current, daily = data.daily;
        const [icon, description] = weatherInfo(current.weather_code, current.is_day === 0);
        $('location').textContent = `📍 ${name}`;
        $('temperature').innerHTML = `${Math.round(current.temperature_2m)}<small>°</small>`;
        $('weather-icon').textContent = icon;
        $('condition').textContent = description;
        $('feels').textContent = `${Math.round(current.apparent_temperature)}°`;
        $('humidity').textContent = `${current.relative_humidity_2m}%`;
        $('wind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
        const forecast = $('forecast'); forecast.replaceChildren();
        for (let i = 0; i < Math.min(4, daily.time.length); i++) {
          const day = document.createElement('div'); day.className = 'day';
          const label = document.createElement('b');
          label.textContent = i === 0 ? '오늘' : new Intl.DateTimeFormat('ko-KR', { weekday: 'short', timeZone: 'UTC' }).format(new Date(`${daily.time[i]}T12:00:00Z`));
          const symbol = document.createElement('span'); symbol.textContent = weatherInfo(daily.weather_code[i])[0];
          const range = document.createElement('small');
          const high = document.createElement('strong'); high.textContent = `${Math.round(daily.temperature_2m_max[i])}°`;
          range.append(high, document.createTextNode(` / ${Math.round(daily.temperature_2m_min[i])}°`));
          day.append(label, symbol, range); forecast.append(day);
        }
        $('updated').textContent = `현지 기준 ${current.time.replace('T', ' ')} 업데이트`;
        try { localStorage.setItem('desk-city', JSON.stringify({ latitude, longitude, name })); } catch (_) {}
      } catch (error) {
        if (error.name !== 'AbortError') $('weather-message').textContent = `${error.message} 인터넷 연결을 확인해 주세요.`;
      }
    }
    $('city-form').addEventListener('submit', async event => {
      event.preventDefault();
      const city = $('city-input').value.trim(); if (!city) return;
      $('weather-message').textContent = '도시를 찾는 중...';
      try {
        const url = new URL('https://geocoding-api.open-meteo.com/v1/search');
        url.search = new URLSearchParams({ name: city, count: '1', language: 'ko', format: 'json' });
        const response = await fetch(url);
        if (!response.ok) throw new Error('도시 검색에 실패했습니다.');
        const match = (await response.json()).results?.[0];
        if (!match) throw new Error('도시를 찾지 못했습니다. 다른 이름으로 검색해 주세요.');
        loadWeather(match.latitude, match.longitude, [match.name, match.country].filter(Boolean).join(', '));
      } catch (error) { $('weather-message').textContent = error.message; }
    });
    $('my-location').addEventListener('click', () => {
      if (!navigator.geolocation) { $('weather-message').textContent = '이 브라우저는 위치 기능을 지원하지 않습니다.'; return; }
      $('weather-message').textContent = '위치 권한을 확인하는 중...';
      navigator.geolocation.getCurrentPosition(
        position => loadWeather(position.coords.latitude, position.coords.longitude, '현재 위치'),
        () => { $('weather-message').textContent = '위치를 사용할 수 없습니다. 브라우저 권한을 확인하거나 도시를 검색해 주세요.'; },
        { timeout: 10000, maximumAge: 300000 }
      );
    });
    let savedCity;
    try { savedCity = JSON.parse(localStorage.getItem('desk-city')); } catch (_) {}
    loadWeather(savedCity?.latitude ?? 37.5665, savedCity?.longitude ?? 126.9780, savedCity?.name ?? '서울');

    // 계산기는 입력값만 상태로 관리합니다. eval / Function으로 문자열을 실행하지 않습니다.
    let current = '0', previous = null, operation = null, resetOnDigit = false, history = '';
    const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
    function formatted(value) {
      if (value === '오류') return value;
      const [whole, decimal] = value.split('.');
      const number = Number(whole);
      if (!Number.isFinite(number)) return value;
      return number.toLocaleString('en-US') + (decimal === undefined ? '' : `.${decimal}`);
    }
    function draw() {
      $('result').textContent = formatted(current);
      $('expression').textContent = operation !== null ? `${formatted(previous)} ${symbols[operation]}` : (history || '\u00a0');
    }
    function compute(a, b, op) {
      const result = op === '+' ? a + b : op === '-' ? a - b : op === '*' ? a * b : a / b;
      if (!Number.isFinite(result)) return null;
      return String(Number(result.toPrecision(12)));
    }
    function press(key) {
      if (key === 'clear') { current = '0'; previous = null; operation = null; resetOnDigit = false; history = ''; }
      else if (/^\d$/.test(key) || key === '.') {
        if (current === '오류' || resetOnDigit) { current = '0'; resetOnDigit = false; if (operation === null) history = ''; }
        if (key === '.') { if (!current.includes('.')) current += '.'; }
        else if (current.replace(/[^\d]/g, '').length < 14) current = current === '0' ? key : current === '-0' ? `-${key}` : current + key;
      } else if (key === 'back') {
        if (current === '오류' || resetOnDigit) { current = '0'; resetOnDigit = false; }
        else current = current.length <= 1 || (current.length === 2 && current.startsWith('-')) ? '0' : current.slice(0, -1);
      } else if (key === 'sign' && current !== '오류') current = current.startsWith('-') ? current.slice(1) : current === '0' ? '0' : `-${current}`;
      else if (key === 'percent' && current !== '오류') current = String(Number((Number(current) / 100).toPrecision(12)));
      else if (key in symbols && current !== '오류') {
        if (operation !== null && !resetOnDigit) {
          const answer = compute(Number(previous), Number(current), operation);
          if (answer === null) { current = '오류'; previous = null; operation = null; history = '0으로 나눌 수 없습니다'; draw(); return; }
          current = answer;
        }
        previous = current; operation = key; history = ''; resetOnDigit = true;
      } else if (key === '=' && operation !== null && current !== '오류') {
        const right = resetOnDigit ? previous : current;
        history = `${formatted(previous)} ${symbols[operation]} ${formatted(right)} =`;
        const answer = compute(Number(previous), Number(right), operation);
        current = answer ?? '오류'; previous = null; operation = null; resetOnDigit = true;
        if (answer === null) history = '0으로 나눌 수 없습니다';
      }
      draw();
    }
    $('keys').addEventListener('click', event => { const button = event.target.closest('button[data-key]'); if (button) press(button.dataset.key); });
    document.addEventListener('keydown', event => {
      if (event.target.closest('input')) return;
      const key = event.key === 'Enter' ? '=' : event.key === 'Escape' ? 'clear' : event.key === 'Backspace' ? 'back' : event.key;
      if (/^[0-9.+*/=%-]$/.test(key) || ['clear', 'back'].includes(key)) { event.preventDefault(); press(key); }
    });
    draw();
  </script>
</body>
</html>
